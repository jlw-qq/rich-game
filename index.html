<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>城市大富翁</title>
    <!-- 先放空图标避免请求 /favicon.ico；启动后由 main.js 换成游戏标志 -->
    <link id="favicon" rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/view/ui/style.css" />
  </head>
  <body>
    <section id="setup" class="setup" aria-label="开局设置"></section>

    <main id="game" class="game" hidden>
      <div class="board-wrap">
        <button id="zoom-out" type="button" class="btn zoom-out" hidden>缩小查看全图</button>
        <canvas
          id="board"
          role="img"
          tabindex="0"
          aria-label="城市大富翁棋盘。选中后用左右方向键逐格查看地产，Esc 取消；玩家位置见右侧面板和事件日志"
          aria-describedby="tile-readout"
        ></canvas>
        <p id="tile-readout" class="visually-hidden" aria-live="polite"></p>
        <p class="board-hint">
          <span class="hint-pointer">悬停或点击地产查看详情 · 选中棋盘后用方向键逐格浏览</span>
          <!-- 触屏提示随放大状态切换，文字由 main.js 写入 -->
          <span id="hint-touch" class="hint-touch" aria-live="polite">点按地产查看详情</span>
        </p>
      </div>

      <aside class="side">
        <div class="toolbar" role="toolbar" aria-label="对局设置">
          <button id="mute" type="button" class="btn btn-ghost" aria-pressed="false">🔇 声音：关</button>
          <button id="speed" type="button" class="btn btn-ghost">⏩ 速度：1×</button>
          <button id="export" type="button" class="btn btn-ghost">导出存档</button>
          <button id="quit" type="button" class="btn btn-ghost" title="对局已自动存档">返回菜单</button>
        </div>
        <section id="tile-card" class="tile-card" aria-label="地产详情" hidden></section>

        <p id="goal" class="goal" aria-live="polite" hidden></p>

        <section aria-labelledby="players-title">
          <h2 id="players-title">玩家</h2>
          <ul id="players" class="players"></ul>
        </section>

        <section id="results" class="card results" aria-labelledby="results-title" hidden></section>

        <section aria-labelledby="status-title" class="card">
          <h2 id="status-title" class="visually-hidden">当前操作</h2>
          <p id="status" class="status" aria-live="polite"></p>
          <div id="actions" class="actions"></div>
        </section>

        <section aria-labelledby="assets-title">
          <h2 id="assets-title">我的地产</h2>
          <div id="assets"></div>
        </section>

        <section aria-labelledby="log-title" class="log-section">
          <!-- 按钮放在标题旁：展开后列表再长，也不会把按钮推到首屏外 -->
          <div class="log-head">
            <h2 id="log-title">事件</h2>
            <button id="log-toggle" type="button" class="btn btn-ghost log-toggle" aria-controls="log" aria-expanded="false" hidden>
              展开全部记录
            </button>
          </div>
          <ol id="log" class="log" aria-live="polite" aria-relevant="additions"></ol>
        </section>

      </aside>
    </main>

    <dialog id="trade" class="trade-dialog" aria-labelledby="trade-title"></dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
